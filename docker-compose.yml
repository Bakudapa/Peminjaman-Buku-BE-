services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: DBPinjamBuku
      DB_USERNAME: postgres
      DB_PASSWORD: secret
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

  webserver:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: DBPinjamBuku
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  frontend:
    build:
      context: ../../peminjaman-buku-FE
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api

volumes:
  pgdata: